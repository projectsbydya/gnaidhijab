{% extends 'base.html' %}
{% block title %}New Password - {{ config.STORE_NAME }}{% endblock %}

{% block content %}
<!-- PAGE HEADER -->
<section class="page-header">
    <div class="container-narrow">
        <span class="section-label">Account Recovery</span>
        <h1 class="page-title">Set New Password</h1>
    </div>
</section>

<!-- RESET PASSWORD FORM -->
<section class="section">
    <div class="container-narrow">
        <div class="auth-form-container">
            <form method="post" action="{{ url_for('auth.reset_password') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="{{ email or '' }}" readonly disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
                <button class="btn btn-primary btn-large w-100">Update Password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
