{% extends 'base.html' %}
{% block title %}Reset Password - {{ config.STORE_NAME }}{% endblock %}

{% block content %}
<!-- PAGE HEADER -->
<section class="page-header">
    <div class="container-narrow">
        <span class="section-label">Account Recovery</span>
        <h1 class="page-title">Reset Password</h1>
    </div>
</section>

<!-- FORGOT PASSWORD FORM -->
<section class="section">
    <div class="container-narrow">
        <div class="auth-form-container">
            <p class="auth-desc">Enter your email address and we'll send you an OTP to reset your password.</p>
            <form method="post" action="{{ url_for('auth.request_reset_password') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <button class="btn btn-primary btn-large w-100">Send OTP</button>
            </form>
            <div class="auth-links">
                <p class="auth-alt">Remember your password? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
