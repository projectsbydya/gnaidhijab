{% extends 'base.html' %}
{% block title %}Admin Login - {{ config.STORE_NAME }}{% endblock %}

{% block content %}
<!-- ADMIN LOGIN -->
<section class="admin-header" style="background: var(--color-gray-900); color: var(--color-white);">
    <div class="admin-header-content">
        <div>
            <span class="admin-label" style="color: var(--color-gray-400);">Admin Access</span>
            <h1 class="admin-title" style="color: var(--color-white);">Login</h1>
        </div>
    </div>
</section>

<!-- LOGIN FORM -->
<section class="admin-section">
    <div class="admin-container">
        <div class="auth-form-container">
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button class="btn btn-primary btn-large w-100">Sign In</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('shop.index') }}" class="link-arrow"><i class="bi bi-arrow-left"></i> Back to Store</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
