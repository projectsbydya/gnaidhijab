{% extends 'base.html' %}
{% block title %}WhatsApp Confirmation - Admin{% endblock %}

{% block content %}
<!-- ADMIN HEADER -->
<section class="admin-header">
    <div class="admin-header-content">
        <div>
            <span class="admin-label">Admin Panel</span>
            <h1 class="admin-title">Confirm Password Change</h1>
        </div>
    </div>
</section>

<!-- CONFIRMATION -->
<section class="admin-section">
    <div class="admin-container">
        <div class="admin-detail-card" style="max-width: 600px;">
            <p class="text-body" style="margin-bottom: 2rem;">Please confirm your password change via WhatsApp using the button below.</p>
            
            <a class="btn btn-primary btn-large w-100 mb-3" href="{{ whatsapp_url }}" target="_blank">
                <i class="bi bi-whatsapp"></i> Open WhatsApp
            </a>
            
            <form method="post" action="{{ url_for('admin.password_change_confirm') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-outline w-100">I have confirmed via WhatsApp</button>
            </form>
        </div>
        
        <div class="admin-back">
            <a href="{{ url_for('admin.dashboard') }}" class="link-arrow"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</section>
{% endblock %}
